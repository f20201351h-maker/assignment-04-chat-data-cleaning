# Session 4 cleaning pipeline configuration.
# The sha256 of this file is recorded in the manifest; change it and the corpus id changes.

[run]
seed = 1
contributor = "ERA V5 student (Assignment 4)"

[[sources]]
shard = "glaive"
kind = "glaive"
path = "data/raw/glaive-function-calling-v2.json"
# languages the source claims (card YAML)
claimed_languages = ["en"]

[[sources]]
shard = "anudesh"
kind = "pairs"
path = "data/raw/anudesh1.parquet"
# IndicAlign card YAML language list
claimed_languages = ["as", "bn", "gu", "en", "hi", "kn", "ml", "mr", "ne", "or", "pa", "sa", "ta", "te", "ur"]

[normalize]
unescape_html = true

[langid]
# a detection only counts if the detector is at least this sure
min_conf = 0.80
# minimum letters before we trust a detection (shorter -> "too_short")
min_letters = 20
# quarantine a doc whose confident language is outside the source's claim
quarantine_outside_claim = true
# Anudesh: user asked in one Indic language, model answered in another one
# measured on the first run: many hits were language-teaching prompts
# ("list the Telugu alphabet"), so this only flags and counts
quarantine_prompt_response_mismatch = false
# translation requests legitimately answer in another language
translation_request_pattern = "(?i)translat|अनुवाद|ভাষান্তর|অনুবাদ|అనువ|மொழிபெயர்|ಅನುವಾದ|ഭാഷാന്തര|വിവർത്തന|ભાષાંતર|ਅਨੁਵਾਦ|भाषांतर|ترجمہ|ترجمه"

[quality]
# applied rules for chat (the 9 widget-4 rules are also run, as an audit only)
greeting_max_words = 3
# looping output: a unit of 2-10 characters repeated 15+ times in a row, or one
# letter 30+ times (code blocks, table rows and rule lines ignored). This replaced
# widget 4's character-bigram and duplicate-line thresholds after a false-positive
# review of the first run found they mostly hit markdown tables and lists.
loop_min_repeats = 15

[dedup]
shingle_words = 5          # widget 5 default k
num_perm = 112             # widget 5 FineWeb preset: 14 bands x 8 rows
bands = 14
rows = 8
jaccard_threshold = 0.75   # FineWeb design target quoted in widget 5
minhash_seed = 1

[decontam]
ngram = 13
min_short_words = 8

[tokens]
repo = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
